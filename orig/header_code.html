<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body,button,input,textarea,select{font-family:'Space Grotesk',Arial,sans-serif}
html.vlnt body > div.fixed.inset-x-0,html.vlnt app-footer{display:none!important}
html.vlnt body,html.vlnt main{background:#fff!important}
html.vlnt main [class*="md:pt-24"],html.vlnt main [class*="lg:pt-28"]{padding-top:2rem!important}
html.vlnt-home main h1{display:none}
html.vlnt-home main [class*="page-max-width"]{width:100%!important;max-width:none!important;padding:0!important}
html.vlnt-home main [class*="w-3/4"]{width:100%!important}
html.vlnt-home main section table img{border-radius:20px}
html.vlnt-home main a[style*="border:2px"]{border-radius:8px}
#vlnt-top{background:#fff;color:#3e3e3c;font-size:14px;border-bottom:1px solid #eee}
#vlnt-top .in,#vlnt-head .in{max-width:1400px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#vlnt-top .in{min-height:34px}
#vlnt-top a{color:#276657;font-weight:700;text-decoration:none}
#vlnt-head{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);position:sticky;top:0;z-index:60}
#vlnt-head .in{min-height:72px}
#vlnt-head img.logo{height:40px;width:auto;display:block}
#vlnt-head nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
#vlnt-head nav a{color:#3e3e3c;font-weight:700;font-size:16px;text-decoration:none;padding:4px 12px;border-radius:8px}
#vlnt-head nav a.on{background:#276657;color:#fff;font-weight:600}
#vlnt-head .btns{display:flex;gap:12px}
#vlnt-head .btns a{display:inline-block;height:40px;line-height:38px;padding:0 24px;border:1px solid #276657;border-radius:4px;font-weight:600;font-size:14px;text-decoration:none;color:#276657;background:#fff}
#vlnt-head .btns a.f{background:#276657;color:#fff}
#vlnt-foot{background:#fff;color:#3e3e3c;padding:64px 16px 40px;margin-top:0}
#vlnt-foot .in{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:48px;justify-content:space-between}
#vlnt-foot .col{flex:1 1 260px}
#vlnt-foot h2{font-size:16px;font-weight:700;color:#222;text-transform:uppercase;margin:0 0 20px}
#vlnt-foot p,#vlnt-foot a{font-size:14px;line-height:1.7;color:#3e3e3c;text-decoration:none;display:block;margin:0 0 12px}
#vlnt-foot p b{color:#3e3e3c}
#vlnt-foot .fb{display:flex;align-items:center;gap:10px;border:1px solid #ddd;padding:12px;max-width:340px;border-radius:4px}
#vlnt-foot .fb span{font-size:15px;font-weight:600;color:#365899}
#vlnt-call{position:fixed;right:20px;bottom:96px;width:56px;height:56px;border-radius:50%;background:#276657;display:flex;align-items:center;justify-content:center;z-index:70;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#vlnt-call svg{width:26px;height:26px;fill:#fff}
@media(max-width:900px){#vlnt-head nav{display:none}#vlnt-head .btns a{padding:0 14px}}
</style>
<script>
(function(){
var p=location.pathname.replace(/\/+$/,'');
var editor=/design_mode|store-preview/.test(location.href);
if(!editor&&(p===''||p==='/home')){location.replace('/page/trang-chu');return;}
if(editor)return;
var de=document.documentElement;
de.classList.add('vlnt');
if(p==='/page/trang-chu'){de.classList.add('vlnt-home');}
var IMG='https://raw.githubusercontent.com/atc336thachan-star/gitclaude/images/orig/';
function nav(href,label){var on=(href==='/page/trang-chu'&&p==='/page/trang-chu')||(href!=='/page/trang-chu'&&p.indexOf(href.split('/').slice(0,3).join('/'))===0&&p!=='');return '<a href="'+href+'"'+(on?' class="on"':'')+'>'+label+'</a>';}
function build(){
 if(document.getElementById('vlnt-head'))return;
 var h=document.createElement('div');
 h.innerHTML='<div id="vlnt-top"><div class="in"><span>Liên hệ: <a href="tel:0948487868">0948487868</a> - <a href="tel:0903232317">0903232317</a></span><span>Email: <a href="mailto:vatlieunoithat.vn@gmail.com">vatlieunoithat.vn@gmail.com</a></span></div></div>'+
 '<div id="vlnt-head"><div class="in"><a href="/page/trang-chu"><img class="logo" src="'+IMG+'logo.png" alt="Vật liệu nội thất"></a><nav>'+nav('/page/trang-chu','Trang chủ')+nav('/collections/all-products','Sản phẩm')+nav('/page/yeu-cau-bao-gia','Báo giá')+nav('/page/lien-he','Liên hệ')+'</nav><div class="btns"><a href="/cart">Giỏ hàng</a><a class="f" href="/page/yeu-cau-bao-gia">Nhận báo giá</a></div></div></div>';
 document.body.insertBefore(h,document.body.firstChild);
 var f=document.createElement('div');
 f.id='vlnt-foot';
 f.innerHTML='<div class="in"><div class="col"><h2>Thông tin liên hệ</h2><p><b>Địa chỉ:</b> Tầng B1 Sảnh Thương mại R1 Royal City, 72 Nguyễn Trãi - Thanh Xuân - Hà Nội</p><p><b>Email:</b> <a style="display:inline" href="mailto:vatlieunoithat.vn@gmail.com">vatlieunoithat.vn@gmail.com</a></p><p><b>Website:</b> <a style="display:inline" href="https://vatlieunoithat.vn">vatlieunoithat.vn</a></p></div>'+
 '<div class="col"><h2>Liên hệ</h2><a href="/page/trang-chu">Về chúng tôi</a><a href="/collections/all-products">Sản phẩm</a><a href="/page/yeu-cau-bao-gia">Tư vấn báo giá</a><a href="/page/lien-he">Liên hệ</a></div>'+
 '<div class="col"><h2>Mạng xã hội</h2><a class="fb" href="https://www.facebook.com/vatlieunoithat.vn/" target="_blank" rel="noopener"><span>Nội Thất Trực Tuyến</span><span style="font-weight:400;color:#666;font-size:13px">Facebook</span></a></div></div>'+
 '<a id="vlnt-call" href="tel:0988716132" aria-label="Gọi ngay" style="margin:0"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg></a>';
 var ft=document.querySelector('footer');
 if(ft&&ft.parentNode){ft.parentNode.insertBefore(f,ft);}else{document.body.appendChild(f);}
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',build);}else{build();}
})();
</script>
