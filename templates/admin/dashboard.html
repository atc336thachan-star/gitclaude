{% extends "admin/index.html" %}
{% block content %}
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:24px">
  {% for label, value, href in stats %}
  <a href="{{ href }}" style="display:block;border:1px solid var(--hairline-color);border-radius:8px;padding:14px;background:var(--darkened-bg);text-decoration:none">
    <div style="font-size:12px;color:var(--body-quiet-color)">{{ label }}</div>
    <div style="font-size:28px;font-weight:700;color:var(--body-fg)">{{ value }}</div>
  </a>
  {% endfor %}
</div>
{{ block.super }}
{% endblock %}
